[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ka-a"
version = "0.1.0"
description = "Local-first irrigation control for Raspberry Pi with a Python dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "playwright>=1.56,<2"]
hardware = ["gpiozero>=2.0,<3", "adafruit-blinka>=8,<9", "adafruit-circuitpython-ads1x15>=3,<4", "adafruit-circuitpython-sht31d>=2.3,<3"]
aws = ["paho-mqtt>=2.1,<3"]

[project.scripts]
kaa = "kaa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kaa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
